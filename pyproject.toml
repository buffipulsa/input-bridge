[project]
name = "input-bridge"
version = "0.1.0"
description = "Host-side layers and automation for a programmable HID macropad"
requires-python = ">=3.11"
dependencies = [
    "hidapi>=0.14.0",
    "pyside6>=6.11.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/input_bridge"]

[project.scripts]
inspect-macropad = "input_bridge.inspect_macropad:main"
observe-raw-input = "input_bridge.observe_raw_input:main"
inspect-protocol = "input_bridge.inspect_protocol:main"
