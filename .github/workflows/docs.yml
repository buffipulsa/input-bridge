name: Build and deploy documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # API autodoc imports the Windows Raw Input implementation. Build on the
    # target platform so documentation imports match the supported runtime.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install UV
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install documentation dependencies
        run: uv sync --locked --group dev

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Sphinx documentation
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
